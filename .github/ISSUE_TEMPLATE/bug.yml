name: Report a bug
description: Tell us what went wrong in VS Chess.
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps to reproduce it and what you expected to happen.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      placeholder: VS Chess 0.2.0, VS Code 1.101, Windows 11
    validations:
      required: true
  - type: textarea
    id: position
    attributes:
      label: Board position or puzzle ID
      description: Include a screenshot, puzzle ID, or the moves leading to the issue if relevant.
